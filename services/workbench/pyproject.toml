[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "zhixu-workbench"
version = "0.1.0"
description = "Zhixu local stdio backend scaffold"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2,<3", "httpx>=0.28,<1", "keyring>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "pip-tools>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
workbench = ["migrations/*.sql"]
